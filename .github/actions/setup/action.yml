name: Set up TimbreBox build
description: >-
  Flutter 3.44.0 (the version of CI's container) cloned from its git tag, without third-party actions, and on
  Linux, when asked, the libraries the desktop build needs.
inputs:
  linux-build:
    description: Whether to install the Linux desktop build libraries (GTK 3, libmpv, clang, CMake, Ninja).
    default: "false"
runs:
  using: composite
  steps:
    # The packages Flutter's Linux desktop build needs, plus libmpv for media_kit (its README, "Linux").
    - name: Linux build libraries
      if: runner.os == 'Linux' && inputs.linux-build == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev
    - name: Flutter
      shell: bash
      env:
        # Keep in step with the container image in ci.yml and full.yml.
        FLUTTER_VERSION: "3.44.0"
      run: |
        dir="$RUNNER_TEMP/flutter"
        git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$dir"
        bin="$dir/bin"
        if [ "$RUNNER_OS" = Windows ]; then bin=$(cygpath -w "$bin"); fi
        echo "$bin" >> "$GITHUB_PATH"
    - name: Flutter version
      shell: pwsh
      run: |
        flutter config --no-analytics
        flutter --version
