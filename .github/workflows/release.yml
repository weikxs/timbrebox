name: Release

# A tag vX.Y.Z publishes a release; vX.Y.Z-rc.N publishes a pre-release for testing. Nothing else runs this
# workflow: pushing commits or branches never does, and ci.yml only runs for pull requests.
#
# The packages travel between jobs through a draft release, which only maintainers can see: the draft is
# made once every check passed, each build machine attaches its packages, fresh machines download, install
# and start them, and only then are checksums.txt added and the draft published. A failed run leaves the
# draft behind; running the workflow again replaces it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: check the tag, version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release page is .github/release-notes/<tag>.md, written by a person from TEMPLATE.md; never
      # commit messages, hashes or emails. The check stops here when it is missing or has TODOs.
      - id: check
        run: scripts/release/check-release.sh "$GITHUB_REF_NAME"

  check:
    name: every check and test
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: make check
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make check

  draft:
    name: start the draft release
    needs: [prepare, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::$GITHUB_REF_NAME is already published; a published release is never replaced"
              exit 1
            fi
            echo "replacing the draft left by an earlier run"
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "TimbreBox $GITHUB_REF_NAME" --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"

  build:
    name: build (${{ matrix.name }})
    needs: [prepare, draft]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macOS universal
            runner: macos-latest
            platform: macos
          # The oldest supported Ubuntu, so the app runs on every distribution with that glibc or newer.
          - name: Linux x86_64
            runner: ubuntu-22.04
            platform: linux
          - name: Windows x64
            runner: windows-latest
            platform: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          linux-build: "true"
      - name: Build the app
        shell: bash
        working-directory: apps/timbrebox_app
        # Plugins read the version as env.appVersion.
        run: flutter build "${{ matrix.platform }}" --release --dart-define=APP_VERSION=${{ needs.prepare.outputs.version }}
      - name: Package it under the release's file names
        shell: bash
        run: scripts/release/package-bundles.sh "${{ needs.prepare.outputs.version }}" dist
      - name: Attach the packages to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/timbrebox_* --clobber

  verify:
    name: install and start (${{ matrix.name }})
    needs: [prepare, build]
    strategy:
      # Every machine reports, so one failure does not hide the others' results.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            pattern: "*_darwin_universal.dmg"
            modes: macos
          - name: Linux x86_64
            runner: ubuntu-22.04
            pattern: "*_linux_amd64.*"
            modes: deb tar
          - name: Windows x64
            runner: windows-latest
            pattern: "*_windows_amd64.zip"
            modes: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the packages from the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --pattern "${{ matrix.pattern }}" --dir dist
      - name: A display for the app on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb dbus-x11
      - name: Install with install.sh and start the app
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for mode in ${{ matrix.modes }}; do
            scripts/release/verify-install.sh "$GITHUB_REF_NAME" dist "$mode"
          done
      - name: Install with install.ps1, start the app and uninstall it
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/release/verify-install.ps1 -Tag "$env:GITHUB_REF_NAME" -Dist dist

  publish:
    name: publish the GitHub release
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern 'timbrebox_*' --dir dist
          cd dist
          set -- timbrebox_*
          test "$#" -eq 4 || { echo "expected 4 packages, found $#: $*"; exit 1; }
          sha256sum timbrebox_* > checksums.txt
          cat checksums.txt
          gh release upload "$GITHUB_REF_NAME" checksums.txt --clobber
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ needs.prepare.outputs.prerelease }}" = true ]; then flag=--prerelease; else flag=--latest; fi
          gh release edit "$GITHUB_REF_NAME" --draft=false "$flag"

  homebrew:
    name: update the Homebrew cask
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    env:
      # A deploy key with write access to weikxs/homebrew-tap. Without it this job does nothing.
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
    steps:
      - name: Is the tap key set?
        id: key
        run: |
          if [ -n "$TAP_KEY" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_SSH_KEY is not set; the Homebrew cask is not updated"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.set == 'true'
      - name: Write the cask
        if: steps.key.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.prepare.outputs.version }}"
          gh release download "$GITHUB_REF_NAME" --pattern "timbrebox_${version}_darwin_universal.dmg" --dir dist
          scripts/release/homebrew-cask.sh "$version" "dist/timbrebox_${version}_darwin_universal.dmg" > "$RUNNER_TEMP/timbrebox.rb"
          cat "$RUNNER_TEMP/timbrebox.rb"
      - name: Push it to weikxs/homebrew-tap
        if: steps.key.outputs.set == 'true'
        run: |
          # A pre-release goes to the rc/timbrebox branch, so the key and the cask are tried before a
          # release without anyone installing it; a release goes to main.
          if [ "${{ needs.prepare.outputs.prerelease }}" = true ]; then branch=rc/timbrebox; else branch=main; fi
          key="$RUNNER_TEMP/tap_key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:weikxs/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          git config user.name "Weikxs"
          git config user.email "weikxs.dev@gmail.com"
          git checkout -B "$branch"
          mkdir -p Casks
          cp "$RUNNER_TEMP/timbrebox.rb" Casks/timbrebox.rb
          git add Casks/timbrebox.rb
          if git diff --cached --quiet; then echo "the cask is already up to date"; exit 0; fi
          git commit -m "timbrebox ${{ needs.prepare.outputs.version }}"
          if [ "$branch" = main ]; then git push origin main; else git push --force origin "$branch"; fi
          rm -f "$key"
