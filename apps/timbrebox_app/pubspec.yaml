name: timbrebox_app
description: "The lightweight five-platform TimbreBox shell."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  audio_service: ^0.18.15
  audio_session: ^0.2.4
  file_picker: ^8.1.2
  flutter_js: ^0.8.0
  crypto: ^3.0.6
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.5
  smtc_windows: ^1.1.0
  mpris_service:
    git:
      url: https://github.com/alexmercerind/mpris_service.git
      ref: master
  path_provider: ^2.1.6
  timbrebox_core:
    path: ../../packages/timbrebox_core
  timbrebox_playback:
    path: ../../packages/timbrebox_playback
  timbrebox_sources:
    path: ../../packages/timbrebox_sources

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/plugin_shims/
